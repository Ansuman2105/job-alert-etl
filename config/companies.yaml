# ATS board tokens. Edit this file from github.com on your phone — the next
# scheduled run picks up the change automatically.
#
# How to find a token: open a company's careers page and read the URL.
#   job-boards.greenhouse.io/databricks  -> greenhouse token "databricks"
#   jobs.ashbyhq.com/openai              -> ashby token      "openai"
#   jobs.lever.co/spotify                -> lever token      "spotify"
#
# Every token below was verified against the live API on 2026-08-13.
# After adding new ones, run `python -m jobalert validate-sources` and delete
# anything reported DEAD — a wrong token is a 404, not an error worth keeping.

