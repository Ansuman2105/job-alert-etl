# Publishing policy.
#
# You asked for every kind of job, so nothing is filtered out by default.
# The LLM still classifies each job into a family and seniority — that metadata
# lands in Postgres now, so when you split into per-topic channels later it is
# a routing change, not a re-enrichment of your whole history.

publish:
  # false = publish everything (current setting)
  # true  = only publish families listed in `families.include`
  filter_by_family: false

  # Ignored while filter_by_family is false. Kept here so the switch is one edit.
  include_families: []

  # Jobs whose posting date is older than this are never published.
  # Protects against a board resurfacing ancient listings.
  max_age_days: 45

# Families the LLM assigns each job to. Keep this list stable — changing a label
# means old rows and new rows disagree.
families:
  - data-engineering
  - data-science-ml
  - analytics-bi
  - software-backend
  - software-frontend
  - devops-sre-platform
  - security
  - product-management
  - design
  - sales-marketing
  - operations-hr-finance
  - other

seniority_levels:
  - intern
  - entry
  - mid
  - senior
  - staff-principal
  - manager
  - director-plus

# --------------------------------------------------------------------------
# Channel routing
# --------------------------------------------------------------------------
# Each job goes to exactly one channel, decided by its location string.
# This is a rule, not an LLM call — free, instant, and it applies retroactively
# to jobs that were enriched before routing existed.

routing:
  # Route name -> the NAME of the environment variable holding that channel's
  # ID. The value itself is a secret and never appears in this file.
  # Order matters: the first matching route wins, and `international` is the
  # catch-all so it must come last.
  channels:
    india: TELEGRAM_CHANNEL_INDIA
    international: TELEGRAM_CHANNEL_INTERNATIONAL

  # A job's location must contain one of these as a WHOLE WORD to be routed to
  # India. Word-boundary matching matters here: a plain substring match on
  # "india" would also catch "Indianapolis, IN" and "Indiana".
  india_location_patterns:
    - india
    - bharat
    - bengaluru
    - bangalore
    - hyderabad
    - pune
    - mumbai
    - delhi
    - gurgaon
    - gurugram
    - noida
    - chennai
    - kolkata
    - ahmedabad
    - jaipur
    - kochi
    - cochin
    - trivandrum
    - thiruvananthapuram
    - indore
    - chandigarh
    - coimbatore
    - mysuru
    - nagpur
    - vadodara
    - surat
    - bhubaneswar
    - visakhapatnam
    - kanpur
    - lucknow
