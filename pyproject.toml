[project]
name = "jobalert"
version = "0.1.0"
description = "Free, cloud-hosted ETL that pulls jobs from ATS boards, enriches them with an LLM, and publishes to Telegram."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "psycopg2-binary>=2.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
jobalert = "jobalert.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
