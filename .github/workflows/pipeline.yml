name: pipeline

on:
  schedule:
    # 11:00 IST = 05:30 UTC. GitHub cron is always UTC and has no timezone option.
    # Scheduled runs are queued, not guaranteed — expect 0-20 minutes of drift.
    - cron: "30 5 * * *"

  # Adds the "Run workflow" button, which is how you trigger this from the phone.
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        type: choice
        default: run
        options:
          - run
          - extract
          - transform
          - enrich
          - publish
          - seed-posted
          - validate-sources
          - status
      dry_run:
        description: "Publish: print instead of sending to Telegram"
        type: boolean
        default: false

concurrency:
  # Never let a manual run collide with the scheduled one — both write the same tables.
  group: jobalert-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Enrichment is the long pole: ~12s per job against Groq's 70B model, which
    # is API latency plus our 2.2s rate-limit throttle. 60 minutes leaves room
    # for ENRICH_LIMIT to be raised without silently hitting the ceiling.
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Fallback for any route whose own channel secret is unset, and the target
      # for failure alerts when TELEGRAM_ALERT_CHANNEL_ID is not set.
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_CHANNEL_INDIA: ${{ secrets.TELEGRAM_CHANNEL_INDIA }}
      TELEGRAM_CHANNEL_INTERNATIONAL: ${{ secrets.TELEGRAM_CHANNEL_INTERNATIONAL }}
      TELEGRAM_ALERT_CHANNEL_ID: ${{ secrets.TELEGRAM_ALERT_CHANNEL_ID }}
      # Measured at ~12s/job, so 150 is roughly a 30-minute stage — comfortably
      # inside the 60-minute timeout. Raise it via a repo Variable once you know
      # your real daily volume, or switch GROQ_MODEL to a faster model.
      ENRICH_LIMIT: ${{ vars.ENRICH_LIMIT || '150' }}
      PUBLISH_LIMIT: ${{ vars.PUBLISH_LIMIT || '60' }}
      PUBLISH_BATCH_SIZE: ${{ vars.PUBLISH_BATCH_SIZE || '5' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Ensure schema
        run: python -m jobalert init-db

      - name: Run
        run: |
          STAGE="${{ inputs.stage || 'run' }}"
          case "$STAGE" in
            publish)
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                python -m jobalert publish --dry-run
              else
                python -m jobalert publish
              fi
              ;;
            seed-posted)
              # Backfill: suppress the first-run flood. Needs --yes because it is
              # destructive to a fresh channel's contents if run by accident.
              python -m jobalert seed-posted --yes
              ;;
            *)
              python -m jobalert "$STAGE"
              ;;
          esac
