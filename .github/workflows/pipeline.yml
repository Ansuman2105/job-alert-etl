name: pipeline

on:
  schedule:
    # Six times a day, roughly every 4 hours. Times are UTC; GitHub cron has no
    # timezone option. IST is UTC+5:30.
    #
    # Two deliberate choices here:
    #
    # 1. No entry sits on :00 or :30. Scheduled workflows run on shared
    #    infrastructure and are dropped under load, and those are the most
    #    contended minutes of the hour — the original "30 5 * * *" was silently
    #    skipped on its first day. The minutes below are also varied rather than
    #    identical, so one busy minute cannot take out the whole day.
    #
    # 2. Six attempts means a dropped run costs at most a few hours of freshness
    #    instead of a whole day. That redundancy matters more than any single
    #    run landing on time.
    - cron: "07 1 * * *"    # 06:37 IST
    - cron: "38 5 * * *"    # 11:08 IST
    - cron: "23 9 * * *"    # 14:53 IST
    - cron: "49 13 * * *"   # 19:19 IST
    - cron: "11 17 * * *"   # 22:41 IST
    - cron: "34 21 * * *"   # 03:04 IST

  # Adds the "Run workflow" button, which is how you trigger this from the phone.
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        type: choice
        default: run
        options:
          - run
          - extract
          - transform
          - enrich
          - publish
          - seed-posted
          - prune
          - validate-sources
          - status
      dry_run:
        description: "Publish: print instead of sending to Telegram"
        type: boolean
        default: false

concurrency:
  # Never let a manual run collide with the scheduled one — both write the same tables.
  group: jobalert-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Enrichment is the long pole: ~12s per job against Groq's 70B model, which
    # is API latency plus our 2.2s rate-limit throttle. 60 minutes leaves room
    # for ENRICH_LIMIT to be raised without silently hitting the ceiling.
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Fallback for any route whose own channel secret is unset, and the target
      # for failure alerts when TELEGRAM_ALERT_CHANNEL_ID is not set.
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_CHANNEL_INDIA: ${{ secrets.TELEGRAM_CHANNEL_INDIA }}
      TELEGRAM_CHANNEL_INTERNATIONAL: ${{ secrets.TELEGRAM_CHANNEL_INTERNATIONAL }}
      TELEGRAM_ALERT_CHANNEL_ID: ${{ secrets.TELEGRAM_ALERT_CHANNEL_ID }}
      # Measured at ~12s/job. This is a ceiling per run, not a target — a run
      # that finds 20 new jobs enriches 20. Lowered from 150 now the pipeline
      # runs six times a day: the daily worst case would otherwise be 900 LLM
      # calls, well past what a free tier allows.
      ENRICH_LIMIT: ${{ vars.ENRICH_LIMIT || '80' }}
      PUBLISH_LIMIT: ${{ vars.PUBLISH_LIMIT || '60' }}
      PUBLISH_BATCH_SIZE: ${{ vars.PUBLISH_BATCH_SIZE || '5' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Ensure schema
        run: python -m jobalert init-db

      - name: Run
        run: |
          STAGE="${{ inputs.stage || 'run' }}"
          case "$STAGE" in
            publish)
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                python -m jobalert publish --dry-run
              else
                python -m jobalert publish
              fi
              ;;
            seed-posted)
              # Backfill: suppress the first-run flood. Needs --yes because it is
              # destructive to a fresh channel's contents if run by accident.
              python -m jobalert seed-posted --yes
              ;;
            *)
              python -m jobalert "$STAGE"
              ;;
          esac
